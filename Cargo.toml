[package]
name = "rustress"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "High-performance load testing engine with an interactive terminal dashboard. Open-loop (RPS) and closed-loop (virtual users) load models with live p50/p90/p95/p99 latency telemetry."
license = "MIT"
readme = "README.md"
repository = "https://github.com/addy-47/RuStress"
homepage = "https://github.com/addy-47/RuStress"
documentation = "https://docs.rs/rustress"
keywords = ["load-testing", "benchmark", "tui", "performance", "http"]
categories = ["command-line-utilities", "development-tools::profiling"]
exclude = ["/.agents", "/.github", "/sandbox", "/temp", "/.qwen", "/public", "/rustress", "/scripts"]

[lib]
name = "rustress"
path = "src/lib.rs"

[[bin]]
name = "rustress"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
clap_complete = "4.5"
crossterm = { version = "0.28", features = ["event-stream"] }
csv = "1.3"
hdrhistogram = "7.5"
indexmap = { version = "2.7", features = ["serde"] }
indicatif = "0.17"
minijinja = { version = "2.7", features = ["loader", "json", "builtins"] }
parking_lot = "0.12"
rand = "0.8"
ratatui = { version = "0.29", features = ["all-widgets", "unstable-rendered-line-info"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "brotli", "zstd"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
toml = "0.8"
tower = "0.5"
# `tower-http` is intentionally unused: a tracing span per request on the
# reference target distorts the very numbers it exists to help measure.
#
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tui-input = { version = "0.11", features = ["crossterm"] }
uuid = { version = "1.13", features = ["v4", "serde"] }

[dev-dependencies]
# Used only by the integration suite to build a genuinely chunked
# `content-length`-free response body. `Stream` must have an unknown size hint
# for hyper to omit the header, which `stream::unfold` gives and `stream::iter`
# over a `Vec` does not.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tempfile = "3.19"

# Benchmarks use a custom `fn main()` so they can report per-stage
# decomposition and assert allocation ceilings. `harness = false` on every
# target; there are no `#[bench]` functions and no nightly requirement.
[[bench]]
name = "hot_path_bench"
harness = false
# Keeps `cargo test` from building these as test targets. It does NOT cover
# `cargo test --all-targets`, which includes benches regardless; the benches
# themselves decline to run under `debug_assertions`.
test = false

[[bench]]
name = "aggregation_bench"
harness = false
test = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# `panic = "abort"` is deliberately NOT set. The TUI restores the host terminal
# from a Drop guard, and an abort skips destructors, which would leave the user's
# shell in raw mode on any panic. Unwinding is the crash-safety mechanism.

[profile.bench]
opt-level = 3
lto = "thin"
debug = true
