[workspace]
members = [
    "crates/core",
    "crates/metrics",
    "crates/templates",
    "crates/runner",
    "crates/tui",
    "crates/export",
    "crates/dummy",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"

# Async
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "brotli", "zstd"] }

# CLI
clap = { version = "4.5", features = ["derive", "wrap_help"] }
clap_complete = "4.5"
indicatif = "0.17"

# TUI
ratatui = { version = "0.29", features = ["all-widgets", "unstable-rendered-line-info"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tui-input = { version = "0.11", features = ["crossterm"] }

# Templates
minijinja = { version = "2.7", features = ["loader", "json", "builtins"] }

# Metrics
hdrhistogram = "7.5"
parking_lot = "0.12"

# Utilities
uuid = { version = "1.13", features = ["v4", "serde"] }
rand = "0.8"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
indexmap = { version = "2.7", features = ["serde"] }
toml = "0.8"

# Dummy server
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
opt-level = 3
lto = "thin"
debug = true
