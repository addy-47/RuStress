[build]
# Parallel codegen units are a MEMORY multiplier, not just a speed one.
# 8 jobs on a 15 GB host is what OOM-killed the session twice.
# Build through scripts/safe-cargo.sh for a hard cgroup memory cap.
jobs = 2

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=apple-m1"]
