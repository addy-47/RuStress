name: CI

# Verification runs on every push to a branch and on every pull request.
# Publishing is gated separately, below, to `refs/tags/v*` only.
on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Keep CI memory bounded; the release/LTO path is the peak.
  CARGO_BUILD_JOBS: 2

jobs:
  test:
    name: test / ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, 1.85]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Examples build
        # An example that no longer compiles is dead documentation. Built, not
        # run: they each take seconds of wall clock and the smoke test below
        # covers "does an example actually work".
        run: cargo build --examples
      - name: Tests
        run: cargo test --all-targets
      - name: Doc tests
        run: cargo test --doc

  # A release build is the memory peak of this project, so it runs on its own
  # rather than alongside the test matrix.
  build:
    name: release build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Docs build warning-free
        run: cargo doc --no-deps

  # The memory-bound tests allocate hundreds of MB against an 8 MB route. They
  # are `#[ignore]`d so that an ordinary `cargo test` on a developer machine is
  # not a memory hazard -- on this project that suite has taken down a desktop
  # session twice. CI runs them explicitly, on a disposable runner.
  memory:
    name: memory bounds (opt-in)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Memory regression tests
        # `concurrency_memory_test` is deterministic and allocates nothing, so it
        # runs in the normal test job. Only `memory_bound_test` is opt-in: it
        # serves 8 MB bodies and its positive control deliberately retains
        # 30 x 8 MB to prove the RSS probe can see retention.
        run: cargo test --test memory_bound_test -- --ignored --test-threads=1

  # Publishes only when a `v*` tag is PUSHED. Not on releases, not on branch
  # pushes -- crates.io rejects a version that already exists, so a
  # mis-triggered publish is a failed job, not a no-op.
  publish:
    name: publish to crates.io
    needs: [build, memory]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Refuse to publish a tag that disagrees with Cargo.toml
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag=$TAG version=$VER"
          if [ "$TAG" != "v$VER" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $VER"
            exit 1
          fi
      - name: Skip if this version is already on crates.io
        # crates.io rejects a re-upload, and a version published from a
        # workstation before the tag was pushed would otherwise turn this job
        # red. Publishing is idempotent, not a tripwire.
        run: |
          TAG="${GITHUB_REF_NAME}"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -A "rustress-ci" \
            "https://crates.io/api/v1/crates/rustress/${TAG#v}")
          if [ "$CODE" = "200" ]; then
            echo "::notice::${TAG} is already published; nothing to do"
            echo "ALREADY_PUBLISHED=1" >> "$GITHUB_ENV"
          fi
      - name: Verify package contents
        if: env.ALREADY_PUBLISHED != '1'
        run: cargo publish --dry-run
      - name: Publish
        if: env.ALREADY_PUBLISHED != '1'
        run: cargo publish --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
