name: CI

# Verification runs on every push to a branch and on every pull request.
# Publishing is gated separately, below, to `refs/tags/v*` only.
on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Keep CI memory bounded; the release/LTO path is the peak.
  CARGO_BUILD_JOBS: 2

jobs:
  test:
    name: test / ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, 1.85]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Doc tests
        run: cargo test --doc

  # A release build is the memory peak of this project, so it runs on its own
  # rather than alongside the test matrix.
  build:
    name: release build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Docs build warning-free
        run: cargo doc --no-deps

  # Publishes only when a `v*` tag is PUSHED. Not on releases, not on branch
  # pushes -- crates.io rejects a version that already exists, so a
  # mis-triggered publish is a failed job, not a no-op.
  publish:
    name: publish to crates.io
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Refuse to publish a tag that disagrees with Cargo.toml
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag=$TAG version=$VER"
          if [ "$TAG" != "v$VER" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $VER"
            exit 1
          fi
      - name: Verify package contents
        run: cargo publish --dry-run
      - name: Publish
        run: cargo publish --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
